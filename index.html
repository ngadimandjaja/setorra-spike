<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setorra</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e3e6eb;--pri:#1f4fd8;--pri2:#e8eefc;--ok:#127a4a;--warn:#a15c00;--bad:#b42318;--r:10px}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;cursor:pointer;color:var(--pri)}header .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:160px}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:70px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:2px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.bad{color:var(--bad);border-color:#f0c6c2}
button:disabled{opacity:.5;cursor:not-allowed}button.sm{padding:3px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border-radius:20px}.tabs button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.tag{display:inline-block;font-size:12px;border-radius:12px;padding:1px 8px;background:#eef0f4;color:#344}
.tag.ok{background:#e3f6ec;color:var(--ok)}.tag.warn{background:#fff1da;color:var(--warn)}.tag.bad{background:#fde7e5;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad)}.ok{color:var(--ok)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw}
.toast.e{background:var(--bad)}
.bar{height:8px;background:#e8eaef;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);width:0}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.link{color:var(--pri);cursor:pointer;text-decoration:underline}
.box{border:1px dashed var(--line);border-radius:8px;padding:10px}
</style>
</head>
<body>
<header><h1 id="home">Setorra</h1><span class="sp"></span><span id="who" class="mut"></span><button id="logout" class="sm" hidden>Keluar</button></header>
<main id="app"><div class="card">Memuat…</div></main>
<script>
(function(){
'use strict';
var CFG=window.SETORRA_CONFIG;
var S={token:null,me:null,courses:[],memberships:[],user:null,isUkrida:false,view:null};
var $=function(s,r){return (r||document).querySelector(s)};
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(iso){if(!iso)return '-';var d=new Date(iso);return isNaN(d)?'-':d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function toLocalInput(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d))return '';var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function fromLocalInput(v){return v?new Date(v).toISOString():''}
function mb(n){return (n/1048576).toFixed(1)+' MB'}
function toast(m,e){var t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},e?6000:2500)}
function csvCell(v,safe){v=String(v==null?'':v);if(safe&&/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function downloadCSV(name,rows,safe){var t='﻿'+rows.map(function(r){return r.map(function(v){return csvCell(v,safe)}).join(',')}).join('\r\n')+'\r\n';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
function splitCSVLine(l){var o=[],c='',q=false,d=(l.indexOf('\t')>=0?'\t':((l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':','));for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o}
function parseRoster(text){
  var lines=String(text).replace(/^﻿/,'').split(/\r?\n/).filter(function(l){return l.trim()}),ix={email:0,nim:1,name:2},rows;
  if(!lines.length)return [];
  var h=splitCSVLine(lines[0]).map(function(x){return x.toLowerCase()});
  var ie=h.findIndex(function(x){return /^e-?mail$/.test(x)});
  if(ie>=0){var inim=h.findIndex(function(x){return /^(nim|id|nim\/id|nim atau id)$/.test(x)}),inm=h.findIndex(function(x){return /^(nama|name|nama lengkap)$/.test(x)});ix={email:ie,nim:inim,name:inm};lines=lines.slice(1)}
  return lines.map(function(l){var p=splitCSVLine(l);return {email:(p[ix.email]||'').trim(),nim:ix.nim>=0?(p[ix.nim]||''):'',name:ix.name>=0?(p[ix.name]||''):''}}).filter(function(x){return x.email});
}

// ---------- API ----------
function api(action,body){
  var p=Object.assign({action:action,token:S.token},body||{});
  return fetch(CFG.backendUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
   .then(function(r){return r.json()})
   .then(function(j){if(!j.ok){var e=new Error(j.error||'Gagal');e.code=j.code;if(j.code==='AUTH'&&S.token){S.token=null;sessionStorage.removeItem('st');toast(j.error,true);renderLogin();}throw e}return j.data});
}
function guard(fn){return function(){var a=arguments;return Promise.resolve().then(function(){return fn.apply(null,a)}).catch(function(e){toast(e.message||String(e),true)})}}

// ---------- Auth ----------
function renderLogin(){
  $('#who').textContent='';$('#logout').hidden=true;
  $('#app').innerHTML='<div class="card"><h2>Masuk ke Setorra</h2><p class="mut">Gunakan akun Google. Mahasiswa UKRIDA memakai akun @ukrida.ac.id; peserta lain boleh memakai akun Google apa pun.</p><div id="gbtn"></div><p id="lerr" class="err"></p></div>';
  var tries=0;(function init(){
    if(window.google&&google.accounts&&google.accounts.id){
      google.accounts.id.initialize({client_id:CFG.clientId,callback:onCred,auto_select:false});
      google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',text:'signin_with',width:280});
    } else if(tries++<50){setTimeout(init,150)} else {$('#lerr').textContent='Gagal memuat Google Sign-In.'}
  })();
}
function onCred(resp){
  $('#lerr')&&($('#lerr').textContent='Memverifikasi…');
  api('login',{idToken:resp.credential}).then(function(d){
    S.token=d.token;sessionStorage.setItem('st',d.token);S.isUkrida=d.isUkrida;S.user=d.user;return boot();
  }).catch(function(e){$('#lerr')&&($('#lerr').textContent=e.message)});
}
function boot(){
  return api('me').then(function(d){
    S.user=d.user;S.courses=d.courses;S.memberships=d.memberships;
    $('#who').textContent=S.user.name+' · '+S.user.email;$('#logout').hidden=false;
    var isStaffGlobal=S.user.globalRoles.length>0;
    if(!S.user.nim&&!isStaffGlobal){return renderProfile(true)}
    route();
  });
}
function isLecturer(){return S.user&&(S.user.globalRoles.indexOf('lecturer')>=0||S.user.globalRoles.indexOf('admin')>=0)}
function isAdmin(){return S.user&&S.user.globalRoles.indexOf('admin')>=0}

function renderProfile(first){
  var isUk=S.isUkrida||/@ukrida\.ac\.id$/.test(S.user.email);
  $('#app').innerHTML='<div class="card" style="max-width:520px"><h2>'+(first?'Lengkapi data Anda':'Profil')+'</h2>'+
   '<div class="col"><div><label>Nama lengkap</label><input id="pn" value="'+esc(S.user.name)+'"></div>'+
   '<div><label>'+(isUk?'NIM':'NIM atau ID lain (mis. NIK/NIP/nomor peserta)')+'</label><input id="pm" value="'+esc(S.user.nim)+'"></div>'+
   '<div><label>Institusi</label><input id="pi" value="'+esc(S.user.institution)+'"></div>'+
   '<div class="row"><button class="pri" id="psave">Simpan</button>'+(first?'':'<button id="pback">Kembali</button>')+'</div></div></div>';
  $('#psave').onclick=guard(function(){return api('updateProfile',{name:$('#pn').value,nim:$('#pm').value,institution:$('#pi').value}).then(function(){toast('Tersimpan');return boot()})});
  if($('#pback'))$('#pback').onclick=function(){route()};
}

// ---------- Router ----------
function go(h){location.hash=h}
window.addEventListener('hashchange',function(){if(S.token&&S.user)route()});
function route(){
  var h=location.hash.replace(/^#\/?/,'').split('/');
  var v=h[0]||'';
  if(v==='course'&&h[1])return renderCourse(h[1],h[2]||'assignments');
  if(v==='assignment'&&h[1])return renderAssignment(h[1],h[2]);
  if(v==='admin'&&isAdmin())return renderAdmin();
  if(v==='profile')return renderProfile(false);
  if(v==='reviews')return renderReviews();
  renderHome();
}
$('#home').onclick=function(){go('')};
$('#logout').onclick=function(){S.token=null;S.user=null;sessionStorage.removeItem('st');if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();renderLogin()};

// ---------- Dashboard mahasiswa ----------
var DASH={rows:null,filter:'all',course:''};
var DST={ontime:['Tepat waktu','ok'],late:['Terlambat','warn'],draft:['Draf, belum dikunci','warn'],pending:['Belum dikumpulkan',''],pending_late:['Belum dikumpulkan (lewat tenggat, masih diterima)','bad'],missed:['Tidak mengumpulkan','bad'],upcoming:['Belum dibuka',''],nogroup:['Belum punya kelompok','warn']};
function fmtWIB(iso){if(!iso)return '-';var d=new Date(iso);return isNaN(d)?'-':d.toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'})+' WIB'}
function durTxt(min){min=Math.max(0,Math.round(min));var d=Math.floor(min/1440),h=Math.floor(min%1440/60),m=min%60;return d?d+' hari '+h+' jam':(h?h+' jam '+m+' mnt':m+' mnt')}
function relDue(iso){if(!iso)return '';var ms=new Date(iso).getTime()-Date.now();if(isNaN(ms))return '';return ms>=0?'sisa '+durTxt(ms/60000):'lewat '+durTxt(-ms/60000)}
function dashNeeds(r){return ['pending','pending_late','draft','nogroup'].indexOf(r.status)>=0}
function dashMatch(r,f){return f==='all'?true:f==='needs'?dashNeeds(r):f==='done'?(r.status==='ontime'||r.status==='late'):f===r.status}
function dashSort(a,b){
  function rank(r){return dashNeeds(r)?0:(r.status==='upcoming'?1:2)}
  var ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;
  var da=new Date(a.dueAt).getTime()||0,db=new Date(b.dueAt).getTime()||0;
  return ra===2?db-da:da-db;
}
function drawDash(){
  var box=$('#dash');if(!box)return;var rows=DASH.rows||[];
  var courses={};rows.forEach(function(r){courses[r.courseId]=(r.courseCode?r.courseCode+' · ':'')+r.courseName});
  var scoped=rows.filter(function(r){return !DASH.course||r.courseId===DASH.course});
  function cnt(f){return scoped.filter(function(r){return dashMatch(r,f)}).length}
  var chips=[['all','Semua'],['needs','Perlu tindakan'],['ontime','Tepat waktu'],['late','Terlambat'],['missed','Tidak mengumpulkan'],['upcoming','Belum dibuka']];
  var h='<div class="card"><div class="row"><h3 class="grow">Tugas saya</h3>'+(Object.keys(courses).length>1?'<select id="dc" style="max-width:260px"><option value="">Semua mata kuliah</option>'+Object.keys(courses).map(function(k){return '<option value="'+esc(k)+'"'+(DASH.course===k?' selected':'')+'>'+esc(courses[k])+'</option>'}).join('')+'</select>':'')+'<button class="sm" id="dr">Segarkan</button></div>';
  h+='<div class="row" style="margin:8px 0">'+chips.map(function(c){return '<button class="sm'+(DASH.filter===c[0]?' pri':'')+'" data-df="'+c[0]+'">'+c[1]+' ('+cnt(c[0])+')</button>'}).join('')+'</div>';
  var list=scoped.filter(function(r){return dashMatch(r,DASH.filter)}).sort(dashSort);
  if(!list.length)h+='<div class="mut">'+(rows.length?'Tidak ada tugas pada filter ini.':'Belum ada tugas yang terbit untuk kelas Anda.')+'</div>';
  else h+='<div style="overflow:auto"><table><tr><th>Tugas</th><th>Tenggat</th><th>Status</th><th>Waktu pengumpulan</th><th>Nilai</th><th></th></tr>'+list.map(function(r){
    var st=DST[r.status]||[r.status,''],soon=dashNeeds(r)&&r.status!=='pending_late'&&new Date(r.dueAt).getTime()-Date.now()<172800000&&new Date(r.dueAt).getTime()>Date.now();
    var when='-';
    if(r.status==='ontime')when=esc(fmtWIB(r.submittedAt));
    else if(r.status==='late')when=esc(fmtWIB(r.submittedAt))+'<div class="mut">terlambat '+esc(durTxt(r.lateMinutes))+'</div>';
    else if(r.hasDraft)when='<span class="mut">belum dikunci; berkas terunggah: '+r.fileCount+(r.updatedAt?', diubah '+esc(fmtWIB(r.updatedAt)):'')+'</span>';
    var note='';
    if(r.status==='missed'&&r.hasDraft)note='<div class="mut">Ada draf berkas, tetapi tidak dikunci sebelum tenggat.</div>';
    if(r.group)note+='<div class="mut">Kelompok: '+esc(r.group.name)+(r.canSubmit?'':' (hanya ketua yang mengumpulkan)')+'</div>';
    var due=['ontime','late'].indexOf(r.status)>=0?'':'<div class="mut'+(soon?' err':'')+'">'+esc(relDue(r.dueAt))+'</div>';
    var g=r.grade?'<b>'+r.grade.total+'</b> / '+r.grade.max:(r.gradesReleased?'-':'<span class="mut">belum dirilis</span>');
    var act=(r.windowOpen&&r.status!=='ontime'&&r.status!=='late'&&r.canSubmit)?'Kumpulkan':'Lihat';
    return '<tr><td><a href="#assignment/'+esc(r.assignmentId)+'"><b>'+esc(r.title)+'</b></a><div class="mut">'+esc(r.courseCode||r.courseName)+' · kelas '+esc(r.className)+' · '+(r.type==='group'?'kelompok':'individu')+'</div>'+note+'</td><td>'+esc(fmtWIB(r.dueAt))+due+'</td><td><span class="tag '+st[1]+'">'+esc(st[0])+'</span></td><td>'+when+'</td><td>'+g+'</td><td><button class="sm'+(act==='Kumpulkan'?' pri':'')+'" data-dg="'+esc(r.assignmentId)+'">'+act+'</button></td></tr>';
  }).join('')+'</table></div><div class="mut" style="margin-top:6px">Waktu ditampilkan dalam WIB. "Tepat waktu" dan "Terlambat" dihitung dari saat Anda menekan <b>Kumpulkan &amp; kunci</b>, bukan saat berkas diunggah.</div>';
  h+='</div>';
  box.innerHTML=h;
  document.querySelectorAll('[data-df]').forEach(function(b){b.onclick=function(){DASH.filter=b.dataset.df;drawDash()}});
  document.querySelectorAll('[data-dg]').forEach(function(b){b.onclick=function(){go('assignment/'+b.dataset.dg)}});
  if($('#dc'))$('#dc').onchange=function(){DASH.course=this.value;drawDash()};
  $('#dr').onclick=function(){loadDash()};
}
function loadDash(){
  var box=$('#dash');if(!box)return Promise.resolve();
  if(!DASH.rows)box.innerHTML='<div class="card mut">Memuat tugas…</div>';
  return api('myDashboard').then(function(d){DASH.rows=d.rows;drawDash()}).catch(function(e){box.innerHTML='<div class="card err">Gagal memuat tugas: '+esc(e.message||e)+' <button class="sm" id="dr">Coba lagi</button></div>';$('#dr').onclick=function(){loadDash()}});
}

// ---------- Home ----------
function renderHome(){
  var h='<div class="row" style="margin-bottom:10px"><h2 class="grow">Beranda</h2><button id="bprof">Profil</button><button id="brev">Tugas peninjauan</button>'+(isAdmin()?'<button id="badm">Admin</button>':'')+(isLecturer()?'<button class="pri" id="bnew">+ Mata kuliah</button>':'')+'</div>';
  var isStu=S.memberships.some(function(m){return m.role==='student'});
  if(isStu)h+='<div id="dash"></div>';
  if(!S.courses.length)h+='<div class="card mut">Belum ada mata kuliah. Masukkan kode kelas dari dosen di bawah.</div>';
  if(S.courses.length)h+='<h3 style="margin:14px 0 8px">Mata kuliah</h3>';
  S.courses.forEach(function(c){
    var roles=S.memberships.filter(function(m){return m.courseId===c.id}).map(function(m){return m.role});
    if(c.ownerEmail===S.user.email)roles.unshift('dosen');
    h+='<div class="card row"><div class="grow"><h3 style="margin:0">'+esc(c.code?c.code+' · ':'')+esc(c.name)+'</h3><div class="mut">'+esc(c.term)+' · '+esc(roles.filter(function(v,i,a){return a.indexOf(v)===i}).join(', '))+'</div></div><button class="pri sm" data-open="'+esc(c.id)+'">Buka</button></div>';
  });
  h+='<div class="card"><h3>Gabung kelas dengan kode</h3><div class="row"><input id="jc" placeholder="Kode kelas (6 karakter)" style="max-width:220px;text-transform:uppercase"><input id="jn" placeholder="'+(S.isUkrida?'NIM':'NIM/ID')+'" value="'+esc(S.user.nim)+'" style="max-width:200px"><button id="bj" class="pri">Gabung</button></div></div>';
  $('#app').innerHTML=h;
  if(isStu){DASH.rows=null;loadDash()}
  document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){go('course/'+b.dataset.open)}});
  $('#bprof').onclick=function(){go('profile')};$('#brev').onclick=function(){go('reviews')};
  if($('#badm'))$('#badm').onclick=function(){go('admin')};
  if($('#bnew'))$('#bnew').onclick=guard(function(){var n=prompt('Nama mata kuliah');if(!n)return;var c=prompt('Kode mata kuliah (opsional)')||'';var t=prompt('Semester/periode (mis. 2026/1)')||'';return api('createCourse',{name:n,code:c,term:t}).then(refreshMe).then(function(){toast('Mata kuliah dibuat')})});
  $('#bj').onclick=guard(function(){return api('joinClass',{joinCode:$('#jc').value,nim:$('#jn').value,name:S.user.name}).then(refreshMe).then(function(){toast('Berhasil bergabung')})});
}
function refreshMe(){return api('me').then(function(d){S.user=d.user;S.courses=d.courses;S.memberships=d.memberships;route()})}

// ---------- Tinjauan ----------
function renderReviews(){
  $('#app').innerHTML='<div class="card"><div class="row"><h2 class="grow">Tugas peninjauan saya</h2><button id="bk">Kembali</button></div><div id="rl">Memuat…</div></div>';
  $('#bk').onclick=function(){go('')};
  guard(function(){return api('myReviews').then(function(rs){
    $('#rl').innerHTML=rs.length?'<table><tr><th>Mata kuliah</th><th>Tugas</th><th>Jumlah</th><th></th></tr>'+rs.map(function(r){return '<tr><td>'+esc(r.course)+'</td><td>'+esc(r.title)+'</td><td>'+r.count+'</td><td><button class="sm" data-a="'+esc(r.assignmentId)+'">Buka</button></td></tr>'}).join('')+'</table>':'<div class="mut">Belum ada penugasan.</div>';
    document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){go('assignment/'+b.dataset.a+'/review')}});
  })})();
}

// ---------- Mata kuliah ----------
function courseRoles(c){
  var r={};if(isAdmin())r.admin=1;if(c.ownerEmail===S.user.email)r.lecturer=1;
  S.memberships.forEach(function(m){if(m.courseId===c.id)r[m.role]=1});return r;
}
function renderCourse(id,tab){
  var c=S.courses.filter(function(x){return x.id===id})[0];if(!c){go('');return}
  var R=courseRoles(c),lect=!!(R.lecturer||R.admin),staff=lect||!!R.assistant;
  var tabs=[['assignments','Tugas']];if(lect)tabs.push(['classes','Kelas & anggota']);if(staff)tabs.push(['grades','Rekap nilai']);if(lect)tabs.push(['audit','Log']);
  var h='<div class="row"><h2 class="grow">'+esc(c.code?c.code+' · ':'')+esc(c.name)+'</h2><button id="bk">Kembali</button></div><div class="tabs">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div><div id="tb">Memuat…</div>';
  $('#app').innerHTML=h;$('#bk').onclick=function(){go('')};
  document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){go('course/'+id+'/'+b.dataset.t)}});
  guard(function(){
    if(tab==='classes')return tabClasses(c,R);if(tab==='grades')return tabGrades(c);if(tab==='audit')return tabAudit(c);return tabAssignments(c,R,lect);
  })();
}

// ---------- Tugas: tampilan ----------
function findAssignment(id){
  var chain=Promise.resolve(null);
  S.courses.forEach(function(c){chain=chain.then(function(f){if(f)return f;return api('listAssignments',{courseId:c.id}).then(function(l){var a=l.filter(function(x){return x.id===id})[0];return a?{a:a,c:c}:null}).catch(function(){return null})})});
  return chain;
}
function renderAssignment(id,mode){
  $('#app').innerHTML='<div class="card">Memuat…</div>';
  guard(function(){return findAssignment(id).then(function(f){
    if(!f)return $('#app').innerHTML='<div class="card">Tugas tidak ditemukan atau Anda tidak punya akses. <button id="bk">Kembali</button></div>',$('#bk').onclick=function(){go('')};
    var R=courseRoles(f.c),staff=!!(R.admin||R.lecturer||R.assistant);
    if(mode==='review'||(staff&&mode!=='submit'))return viewReview(f.a,f.c,R);
    return api('mySubmission',{assignmentId:id}).catch(function(e){if(e.code==='FORBIDDEN'||e.code==='NO_GROUP'){return {noOwner:e}}throw e}).then(function(m){
      if(m.noOwner&&(R.reviewer||R.mentor))return viewReview(f.a,f.c,R);
      return viewSubmit(f.a,f.c,m);
    });
  })})();
}

  h+='</div>';
  if(a.type==='group'){
    h+='<div class="card"><h3>Kelompok</h3>'+(m.group?'<div><b>'+esc(m.group.name)+'</b> · ketua: '+esc(m.group.leaderEmail)+'<br><span class="mut">'+m.group.members.map(esc).join(', ')+'</span></div>'+(!locked?'<button class="sm" id="eg" style="margin-top:6px">Ubah kelompok</button>':''):'<div class="mut">Anda belum punya kelompok.</div><button class="sm pri" id="eg">Buat kelompok</button>')+(a.submitterRule==='leader'?'<div class="mut" style="margin-top:6px">Hanya ketua yang dapat mengumpulkan.</div>':'')+'</div>';
  }
  if(m.grade){h+='<div class="card"><h3>Nilai</h3><div style="font-size:24px"><b>'+m.grade.total+'</b> / '+m.grade.max+'</div>'+(m.grade.scores.length?'<table><tr><th>Kriteria</th><th>Skor</th><th>Catatan</th></tr>'+m.grade.scores.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+s.score+' / '+s.max+'</td><td>'+esc(s.note)+'</td></tr>'}).join('')+'</table>':'')+(m.grade.feedback?'<p style="white-space:pre-wrap"><b>Umpan balik:</b> '+esc(m.grade.feedback)+'</p>':'')+'</div>'}
  if(m.canSubmit!==false){
    h+='<div class="card"><h3>Berkas</h3>';
    a.slots.forEach(function(s){
      var f=files.filter(function(x){return x.slotId===s.id})[0];
      h+='<div class="slot" data-slot="'+esc(s.id)+'"><div class="row"><b class="grow">'+esc(s.label)+(s.required?' *':'')+'</b><span class="mut">'+(s.kind==='link'?'tautan':esc(s.exts||'bebas')+' · maks '+s.maxMB+' MB')+'</span></div>';

      if(!locked&&win&&win.open){

        if(s.kind==='link'||s.kind==='video')h+='<div class="row" style="margin-top:6px"><input placeholder="'+(s.kind==='video'?'Atau tempel tautan video (wajib untuk video besar)':'https://…')+'" data-lk="'+esc(s.id)+'"><button class="sm" data-sl="'+esc(s.id)+'">Simpan tautan</button></div>';
      }

    });

  $('#bk').onclick=function(){go('course/'+c.id)};
  document.querySelectorAll('[data-dl]').forEach(function(b){b.onclick=guard(function(){return api('fileAccess',{fileId:b.dataset.dl}).then(function(r){window.open(r.url,'_blank','noopener')})})});
  document.querySelectorAll('[data-rf]').forEach(function(b){b.onclick=guard(function(){if(!confirm('Hapus berkas ini?'))return;return api('removeFile',{fileId:b.dataset.rf}).then(function(){renderAssignment(a.id)})})});
  document.querySelectorAll('[data-sl]').forEach(function(b){b.onclick=guard(function(){var v=document.querySelector('[data-lk="'+b.dataset.sl+'"]').value;return api('submitLink',{assignmentId:a.id,slotId:b.dataset.sl,url:v}).then(function(){toast('Tautan tersimpan');renderAssignment(a.id)})})});
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=guard(function(){
    var slotId=b.dataset.go,box=b.closest('.slot'),inp=box.querySelector('[data-up]'),file=inp.files[0];
    if(!file)throw new Error('Pilih berkas dulu');
    var slot=a.slots.filter(function(s){return s.id===slotId})[0];
    var e=file.name.split('.').pop().toLowerCase(),allowed=String(slot.exts||'').split(/[ ,;]+/).filter(Boolean);
    if(allowed.length&&allowed.indexOf(e)<0)throw new Error('Jenis .'+e+' tidak diizinkan. Diizinkan: '+allowed.join(', '));
    if(file.size>slot.maxMB*1048576)throw new Error('Ukuran '+mb(file.size)+' melebihi batas '+slot.maxMB+' MB'+(slot.kind==='video'?'. Untuk video besar, kirim tautan saja.':''));
    b.disabled=true;
    return uploadFile(a,slot,file,box).then(function(){toast('Berkas terunggah');renderAssignment(a.id)}).catch(function(er){b.disabled=false;throw er});
  })});
  if($('#fs'))$('#fs').onclick=guard(function(){if(!confirm('Kumpulkan dan kunci pengumpulan?'))return;return api('finalSubmit',{assignmentId:a.id}).then(function(){toast('Terkumpul');renderAssignment(a.id)})});
  if($('#eg'))$('#eg').onclick=guard(function(){return groupForm(a,c,m)});
}

function retry(fn,n,label){
  var i=0;
  return new Promise(function(res,rej){(function t(){fn().then(res).catch(function(e){if(e&&e.noRetry||++i>=n)return rej(e);setTimeout(t,800*i)})})()});
}
function uploadFile(a,slot,file,box){
  var bar=box.querySelector('.bar'),fill=bar.firstElementChild,stEl=box.querySelector('[data-st]');
  bar.hidden=false;function prog(p,msg){fill.style.width=Math.round(p*100)+'%';stEl.textContent=msg||''}
  prog(0,'Menyiapkan…');
  return api('beginUpload',{assignmentId:a.id,slotId:slot.id,filename:file.name,bytes:file.size,mime:file.type||'application/octet-stream'}).then(function(b){
    return putChunks(b.uploadUrl,file,prog).then(function(driveId){
      prog(1,'Memfinalisasi…');
      return retry(function(){return api('finalizeUpload',{uploadToken:b.uploadToken,driveFileId:driveId}).catch(function(e){if(['BAD','LOCKED','CLOSED','FORBIDDEN','DRIVE','NOT_FOUND'].indexOf(e.code)>=0)e.noRetry=true;throw e})},3);
    }).catch(function(e){api('cancelUpload',{uploadToken:b.uploadToken}).catch(function(){});throw e});
  });
}
// Resumable upload langsung ke Drive, potongan 8 MB (kelipatan 256 KB), dengan pemulihan setelah koneksi putus.
function putChunks(url,file,prog){
  var CH=8*1048576,total=file.size,pos=0,fails=0;
  function queryOffset(){
    return fetch(url,{method:'PUT',headers:{'Content-Range':'bytes */'+total}}).then(function(r){
      if(r.status===308){var rg=r.headers.get('Range');return rg?parseInt(rg.split('-')[1],10)+1:0}
      if(r.status===200||r.status===201)return r.json().then(function(j){return {done:j.id}});
      throw new Error('Status Drive '+r.status);
    });
  }
  function step(){
    if(total===0)return Promise.reject(new Error('Berkas kosong'));
    var end=Math.min(pos+CH,total);
    return fetch(url,{method:'PUT',headers:{'Content-Range':'bytes '+pos+'-'+(end-1)+'/'+total},body:file.slice(pos,end)}).then(function(r){
      if(r.status===308){pos=end;fails=0;prog(pos/total,'Mengunggah '+mb(pos)+' / '+mb(total));return step()}
      if(r.status===200||r.status===201)return r.json().then(function(j){if(!j.id)throw new Error('Drive tidak mengembalikan id');return j.id});
      throw new Error('Drive menolak potongan ('+r.status+')');
    }).catch(function(e){
      if(++fails>5)throw new Error('Koneksi terputus berulang kali. Coba lagi. ('+e.message+')');
      prog(pos/total,'Koneksi bermasalah, mencoba memulihkan…');
      return new Promise(function(r){setTimeout(r,1000*fails)}).then(queryOffset).then(function(o){if(o&&o.done)return o.done;pos=o;return step()});
    });
  }
  return step();
}

function viewReview(a,c,R){
  var full=!!(R.admin||R.lecturer||R.assistant),lect=!!(R.admin||R.lecturer);
  return api('listSubmissions',{assignmentId:a.id}).then(function(d){
    var A=d.assignment,rows=d.rows;
    var h='<div class="row"><h2 class="grow">'+esc(A.title)+'</h2><button id="bk">Kembali</button></div>';
    if(lect)h+='<div class="card row"><button id="rel" class="'+(A.gradesReleased?'':'pri')+'">'+(A.gradesReleased?'Tarik kembali nilai':'Rilis nilai ke mahasiswa')+'</button><span class="tag '+(A.gradesReleased?'ok':'warn')+'">'+(A.gradesReleased?'Nilai sudah dirilis':'Nilai belum dirilis')+'</span>'+(A.type==='group'?'<button id="lgf" class="sm">Kunci/buka pembentukan kelompok</button>':'')+'</div>';
    h+='<div class="card"><div style="overflow:auto"><table><tr><th>'+(lect||full?'<input type="checkbox" id="all" style="width:auto">':'')+'</th><th>Pengumpul</th><th>Status</th><th>Berkas</th><th>Nilai</th><th></th></tr>'+
     rows.map(function(r){var s=r.submission,fin=(r.grades||[]).filter(function(g){return g.isFinal})[0]||r.myGrade;return '<tr><td>'+(lect?'<input type="checkbox" data-sel="'+esc(s.id)+'" style="width:auto">':'')+'</td><td><b>'+esc(r.owner.name)+'</b><div class="mut">'+esc(r.owner.nim||'')+(r.owner.members?r.owner.members.map(esc).join(', '):'')+'</div></td><td><span class="tag '+(s.status==='locked'?'ok':'warn')+'">'+esc(s.status==='locked'?'terkunci':'draf')+'</span>'+(s.late?' <span class="tag warn">telat</span>':'')+'<div class="mut">'+esc(fmt(s.lockedAt||s.updatedAt))+'</div></td><td>'+s.files.map(function(f){return '<div><span class="link" data-dl="'+esc(f.id)+'">'+esc(f.kind==='link'?'tautan':f.storedName)+'</span>'+(f.kind==='file'?'<div class="mut">asal: '+esc(f.originalName)+'</div>':'')+'</div>'}).join('')+'</td><td>'+(fin?fin.total+' / '+A.maxPoints:'-')+(r.reviewers&&r.reviewers.length?'<div class="mut">'+r.reviewers.map(function(x){return esc(x.email)+' ('+esc(x.role)+')'}).join(', ')+'</div>':'')+'</td><td><button class="sm pri" data-gr="'+esc(s.id)+'">Nilai</button>'+(lect&&s.status==='locked'?' <button class="sm" data-ul="'+esc(s.id)+'">Buka kunci</button>':'')+'</td></tr>'}).join('')+'</table></div></div>';
    if(lect&&d.missing.length)h+='<div class="card"><h3>Belum mengumpulkan ('+d.missing.length+')</h3><div class="mut">'+d.missing.map(function(x){return esc(x.nim+' '+x.name)}).join(' · ')+'</div></div>';
    if(lect)h+='<div class="card"><h3>Tugaskan peninjau untuk baris terpilih</h3><div class="row"><input id="re" placeholder="email reviewer/mentor" class="grow"><select id="rr" style="max-width:160px"><option value="reviewer">Reviewer/penguji</option><option value="mentor">Mentor</option></select><label style="margin:0"><input type="checkbox" id="rn" style="width:auto"> kirim email</label><button class="pri" id="rb">Tugaskan</button></div></div>';
    h+='<div id="gp"></div>';
    $('#app').innerHTML=h;
    window._rows=rows;window._A=A;
    $('#bk').onclick=function(){go('course/'+c.id)};
    document.querySelectorAll('[data-dl]').forEach(function(b){b.onclick=guard(function(){return api('fileAccess',{fileId:b.dataset.dl}).then(function(r){window.open(r.url,'_blank','noopener')})})});
    document.querySelectorAll('[data-ul]').forEach(function(b){b.onclick=guard(function(){var why=prompt('Alasan membuka kunci (opsional)')||'';return api('unlockSubmission',{submissionId:b.dataset.ul,reason:why}).then(function(){renderAssignment(a.id,'review')})})});
    document.querySelectorAll('[data-gr]').forEach(function(b){b.onclick=function(){gradePanel(a,rows.filter(function(r){return r.submission.id===b.dataset.gr})[0],R)}});
    if($('#all'))$('#all').onchange=function(){document.querySelectorAll('[data-sel]').forEach(function(x){x.checked=$('#all').checked})};
    if($('#rel'))$('#rel').onclick=guard(function(){return api('setGradesReleased',{assignmentId:a.id,released:!A.gradesReleased}).then(function(){renderAssignment(a.id,'review')})});
    if($('#lgf'))$('#lgf').onclick=guard(function(){var l=confirm('OK = kunci pembentukan kelompok oleh mahasiswa. Batal = buka kembali.');return api('lockGroupFormation',{assignmentId:a.id,locked:l}).then(function(){toast(l?'Dikunci':'Dibuka')})});
    if($('#rb'))$('#rb').onclick=guard(function(){var ids=[].map.call(document.querySelectorAll('[data-sel]:checked'),function(x){return x.dataset.sel});if(!ids.length)throw new Error('Pilih minimal satu baris');return api('assignReviewers',{assignmentId:a.id,submissionIds:ids,reviewerEmail:$('#re').value,role:$('#rr').value,notify:$('#rn').checked}).then(function(r){toast(r.assigned+' penugasan dibuat');renderAssignment(a.id,'review')})});

function gradePanel(a,row,R){
  var A=window._A,lect=!!(R.admin||R.lecturer),role=lect?'lecturer':(R.assistant?'assistant':(row.myRole||''));
  var mentorOnlyNote=role==='mentor'&&!A.mentorGrading;
  var my=row.myGrade||{scores:[],total:'',feedback:''};
  var h='<div class="card"><div class="row"><h3 class="grow">Penilaian: '+esc(row.owner.name)+'</h3><button class="sm" id="gx">Tutup</button></div>';
  if(mentorOnlyNote)h+='<div class="mut">Dosen belum mengaktifkan penilaian oleh mentor untuk tugas ini. Anda dapat memberi catatan.</div>';
  else if(A.rubric.length)h+=A.rubric.map(function(r){var sc=my.scores.filter(function(x){return x.id===r.id})[0];return '<div class="row slot"><div class="grow"><b>'+esc(r.name)+'</b><div class="mut">'+esc(r.desc||'')+'</div></div><div style="width:110px"><label>Skor (0-'+r.max+')</label><input type="number" min="0" max="'+r.max+'" data-cr="'+esc(r.id)+'" value="'+esc(sc?sc.score:'')+'"></div><div class="grow"><label>Catatan</label><input data-cn="'+esc(r.id)+'" value="'+esc(sc?sc.note:'')+'"></div></div>'}).join('');
  else h+='<div style="max-width:200px"><label>Nilai (0-'+A.maxPoints+')</label><input id="gt" type="number" value="'+esc(my.total)+'"></div>';
  h+='<div><label>'+(mentorOnlyNote?'Catatan mentor':'Umpan balik')+'</label><textarea id="gf">'+esc(my.feedback)+'</textarea></div>';
  if(lect&&(row.grades||[]).length>1)h+='<div class="box" style="margin-top:8px"><b>Nilai dari penilai lain</b>'+row.grades.map(function(g){return '<div class="row"><span>'+esc(g.graderEmail)+' ('+esc(g.graderRole)+'): <b>'+g.total+'</b>'+(g.isFinal?' <span class="tag ok">final</span>':'')+'</span>'+(!g.isFinal?'<button class="sm" data-fin="'+esc(g.id)+'">Jadikan final</button>':'')+'<span class="mut">'+esc(g.feedback)+'</span></div>'}).join('')+'</div>';
  h+='<div class="row" style="margin-top:8px"><button class="pri" id="gsv">Simpan</button></div></div>';
  $('#gp').innerHTML=h;$('#gp').scrollIntoView({behavior:'smooth'});
  $('#gx').onclick=function(){$('#gp').innerHTML=''};
  document.querySelectorAll('[data-fin]').forEach(function(b){b.onclick=guard(function(){return api('setFinalGrade',{gradeId:b.dataset.fin}).then(function(){renderAssignment(a.id,'review')})})});
  $('#gsv').onclick=guard(function(){
    var sid=row.submission.id;
    if(mentorOnlyNote)return api('mentorNote',{submissionId:sid,feedback:$('#gf').value}).then(function(){toast('Catatan tersimpan');renderAssignment(a.id,'review')});
    var body={submissionId:sid,feedback:$('#gf').value};
    if(A.rubric.length)body.scores=A.rubric.map(function(r){var v=document.querySelector('[data-cr="'+r.id+'"]').value;if(v==='')throw new Error('Skor "'+r.name+'" belum diisi');return {id:r.id,score:Number(v),note:document.querySelector('[data-cn="'+r.id+'"]').value}});
    else body.total=Number($('#gt').value);
    return api('saveGrade',body).then(function(r){toast('Tersimpan (total '+r.total+')');renderAssignment(a.id,'review')});
  });
}
